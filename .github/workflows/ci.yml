name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  workflows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install actionlint 1.7.12
        run: |
          set -euo pipefail
          curl -sSL -o actionlint.tar.gz https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  actionlint.tar.gz" | sha256sum -c -
          tar xzf actionlint.tar.gz actionlint
      - run: ./actionlint
      - run: shellcheck packaging/release-gates.sh

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run build

  rust:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Format (host workspace)
        run: cargo fmt --check
      - name: Clippy (host workspace)
        run: cargo clippy --locked -p insto-desktop-host -- -D warnings
      - name: Tests (host workspace)
        run: cargo test -p insto-desktop-host --locked

  python:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: python3 -B -m unittest discover -s tests -v

  bundle-debug:
    needs: [workflows, frontend, rust, python]
    runs-on: macos-14
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri
      - run: npm ci --ignore-scripts
      - name: Build the frontend (tauri::generate_context! needs ../dist)
        run: npm run build
      - name: Read the core pin
        id: pin
        run: echo "commit=$(jq -r .core_commit packaging/core-pin.json)" >>"$GITHUB_OUTPUT"
      - uses: ./.github/actions/stage-runtime
        with:
          core-ref: ${{ steps.pin.outputs.commit }}
          output: runtime-ci
          stage: "true"
      - name: Format (application workspace)
        working-directory: src-tauri
        run: cargo fmt --check
      - name: Clippy (application workspace)
        working-directory: src-tauri
        run: cargo clippy --locked -- -D warnings
      - name: Tests (application workspace)
        working-directory: src-tauri
        run: cargo test --locked
      - name: Fetch the host workspace's crates for the notices check
        run: cargo fetch --locked
      - name: Third-party notices are current
        run: python3 -B -m scripts.third_party_notices | diff - THIRD-PARTY-NOTICES.md
      - name: Debug bundle
        run: npm run tauri -- build --debug --bundles app -- --locked
      - name: Signature and runtime gates on the debug bundle
        run: |
          set -euo pipefail
          app="$PWD/src-tauri/target/debug/bundle/macos/insto.app"
          codesign --verify --deep --strict "$app"
          python3 -B -m scripts.verify_app_runtime "$app"
