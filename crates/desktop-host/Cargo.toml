[package]
name = "insto-desktop-host"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["process", "io-util", "time", "sync", "rt-multi-thread", "macros"] }
sha2 = "0.10"
libc = "0.2"

[dev-dependencies]
tempfile = "3"
